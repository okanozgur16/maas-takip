name: Deploy ShiftPay to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'automation/**'
      - 'README.md'
      - 'AI-HANDOFF.md'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pre-Deploy Safety Guard (V8 Syntax, Math Regression, Version Sync, Duplicate IDs & Secret Scan)
        run: |
          python3 - << 'EOF'
          import re, json, subprocess, tempfile, sys

          html = open('index.html', encoding='utf-8').read()
          v_json = json.load(open('version.json', encoding='utf-8'))
          sw_js = open('sw.js', encoding='utf-8').read()

          # 1. Version consistency check
          m_app = re.search(r"APP_VER\s*=\s*'([^']+)'", html)
          m_sw = re.search(r"CACHE\s*=\s*'([^']+)'", sw_js)
          v_v = v_json.get('v')
          assert m_app and m_sw and v_v, "Missing version strings!"
          assert m_app.group(1) == v_v, f"APP_VER ({m_app.group(1)}) != version.json ({v_v})"
          assert v_v in m_sw.group(1), f"sw.js CACHE ({m_sw.group(1)}) does not contain {v_v}"
          print(f"[OK] Version sync: {v_v}")

          # 2. Real V8 JavaScript syntax check on all inline scripts + sw.js
          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, re.S)
          assert len(scripts) >= 1, "No inline scripts found!"
          for idx, sc in enumerate(scripts):
              with tempfile.NamedTemporaryFile('w', suffix='.js', encoding='utf-8', delete=False) as tf:
                  tf.write(sc)
                  tf_path = tf.name
              res = subprocess.run(['node', '--check', tf_path], capture_output=True, text=True)
              if res.returncode != 0:
                  print(f"[FAIL] JS syntax error in inline script #{idx+1}:\n{res.stderr}", file=sys.stderr)
                  sys.exit(1)
          res_sw = subprocess.run(['node', '--check', 'sw.js'], capture_output=True, text=True)
          if res_sw.returncode != 0:
              print(f"[FAIL] JS syntax error in sw.js:\n{res_sw.stderr}", file=sys.stderr)
              sys.exit(1)
          print(f"[OK] V8 JS syntax check passed ({len(scripts)} inline scripts + sw.js)")

          # 3. Pre-Deploy Payroll Math Regression Test (calcPay via Node)
          main_sc = max(scripts, key=len)
          m_r2 = re.search(r'function r2\([^)]*\)\{[^}]+\}', main_sc)
          m_tax = re.search(r'function taxNormal\([^)]*\)\{.*?\n\}', main_sc, re.S)
          m_cp = re.search(r'function calcPay\([^)]*\)\{.*?\n\}', main_sc, re.S)
          if m_r2 and m_tax and m_cp:
              math_harness = m_r2.group(0) + '\n' + m_tax.group(0) + '\n' + m_cp.group(0) + '''
              const S = {
                rate: 14.99, mNormal: 1, mIrr: 1.5, mOver: 1.85, vacPayPct: 0, adv: 0.43, advMode: 'non185',
                vacPct: 0.0833, franchise: 295.36, pensComp: 0.04, housingGross: 86.71, housingTotal: 147.35,
                paww: 0.001, azv: 0.005, stipp: 0.026, wia: 0.005, bTaxRate: 0.3582, whk: 0.005,
                utilities: 12.5, insurance: 38.01, driverDay: 5, extraIns: 0, customIn: 0, customOut: 0,
                wkHomeDeduct: 0, vacAccPct: 0.1087, taxTable: [[0,0],[400,25],[600,90],[900,210],[1500,480]]
              };
              const res = calcPay({ any: true, norm: 36, irr: 4, over: 0, vacH: 0, driverDays: 5, noAutoVac: true }, S);
              if (!Number.isFinite(res.gross) || !Number.isFinite(res.payable) || res.gross <= 500 || res.payable <= 250 || res.tax < 0) {
                console.error('Math regression failure:', res);
                process.exit(1);
              }
              console.log('[OK] Payroll math regression test passed: gross=' + res.gross + ' payable=' + res.payable + ' tax=' + res.tax);
              '''
              with tempfile.NamedTemporaryFile('w', suffix='.js', encoding='utf-8', delete=False) as mf:
                  mf.write(math_harness)
                  mf_path = mf.name
              res_m = subprocess.run(['node', mf_path], capture_output=True, text=True)
              if res_m.returncode != 0:
                  print(f"[FAIL] Payroll math test failed:\n{res_m.stderr}\n{res_m.stdout}", file=sys.stderr)
                  sys.exit(1)
              print(res_m.stdout.strip())

          # 4. Duplicate HTML IDs check
          body = html[html.find('<body>'):html.find('<script')]
          ids = re.findall(r'\bid="([^"]+)"', body)
          dups = sorted(set(x for x in ids if ids.count(x) > 1))
          assert not dups, f"Duplicate HTML IDs found: {dups}"
          print("[OK] Zero duplicate HTML IDs")

          # 5. I18N_EN JSON validity + zero Turkish characters in English values
          m_en = re.search(r'var I18N_EN = (\{.*?\});', html)
          assert m_en, "I18N_EN not found!"
          i18n = json.loads(m_en.group(1))
          tr_in_en = [k for k, v in i18n.items() if re.search(r'[ğşıİöüçĞŞÖÜÇ]', v)]
          assert not tr_in_en, f"Turkish characters found in I18N_EN values for keys: {tr_in_en[:5]}"
          print(f"[OK] I18N_EN valid ({len(i18n)} entries, 0 TR leaks)")

          # 6. Expanded generic secret & PII leak check
          secret_patterns = [
              (r"OWNER_SYNC_ID\s*=", "Raw OWNER_SYNC_ID variable"),
              (r"\bsp_[A-Za-z0-9_-]{25,}", "OWNER_TOKEN pattern"),
              (r"\bghp_[A-Za-z0-9]{30,}", "GitHub PAT token"),
              (r"\bsk-[A-Za-z0-9_-]{25,}", "Secret API key"),
              (r"-----BEGIN [A-Z ]*PRIVATE KEY-----", "Private key block"),
              (r"[A-Za-z0-9._%+-]+@gmail\.com", "Personal Gmail address")
          ]
          for pat, desc in secret_patterns:
              assert not re.search(pat, html), f"Forbidden leak ({desc}) detected in index.html!"
          print("[OK] Zero secret/PII leaks")
          EOF

      - name: Prepare clean public web directory (strict, no server/ or AI docs)
        run: |
          set -e
          rm -rf dist && mkdir -p dist
          # Required web assets (fail build if any missing)
          for f in index.html version.json sw.js manifest.webmanifest icon-192.png icon-512.png apple-touch-icon.png; do
            cp "$f" dist/
          done
          cp -r fonts lib dist/
          # Optional Cloudflare routing/header files
          for opt in _headers _redirects .nojekyll; do
            if [ -f "$opt" ]; then cp "$opt" dist/; fi
          done
          ls -la dist

      - name: Publish to Cloudflare Pages (shiftpay-app)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 3bf7fc774af3ec087fc3d01b6856c0bd
          command: pages deploy dist --project-name=shiftpay-app --branch=main

      - name: Publish Cloudflare Worker (summer-mode-6176 — preserves secrets & KV)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          META='{"main_module":"bildirim-worker.js","compatibility_date":"2024-11-01","keep_bindings":["secret_text","plain_text","kv_namespace"],"bindings":[{"type":"kv_namespace","name":"KV","namespace_id":"9f5663780da9445ebbfc175d3d0fa1dd"}]}'
          HTTP_CODE=$(curl -sS -o /tmp/cf_worker_out.json -w "%{http_code}" \
            -X PUT "https://api.cloudflare.com/client/v4/accounts/3bf7fc774af3ec087fc3d01b6856c0bd/workers/scripts/summer-mode-6176" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -F "metadata=$META;type=application/json" \
            -F "bildirim-worker.js=@server/bildirim-worker.js;filename=bildirim-worker.js;type=application/javascript+module")
          echo "Cloudflare Worker deploy HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "[OK] Cloudflare Worker summer-mode-6176 updated automatically!"
          else
            cat /tmp/cf_worker_out.json || true
            exit 1
          fi

      - name: Validate & Publish Firebase Firestore Security Rules (maas-takip-sync)
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SA_JSON" ]; then
            echo "[SKIP] FIREBASE_SERVICE_ACCOUNT secret not configured"
            exit 0
          fi
          GCP_TOKEN=$(node -e '
            const crypto = require("crypto");
            const https = require("https");
            const sa = JSON.parse(process.env.FIREBASE_SA_JSON);
            const now = Math.floor(Date.now() / 1000);
            const b64u = (o) => Buffer.from(JSON.stringify(o)).toString("base64url");
            const unsigned = b64u({ alg: "RS256", typ: "JWT" }) + "." + b64u({
              iss: sa.client_email,
              scope: "https://www.googleapis.com/auth/cloud-platform https://www.googleapis.com/auth/firebase",
              aud: "https://oauth2.googleapis.com/token",
              iat: now,
              exp: now + 3600
            });
            const sig = crypto.createSign("RSA-SHA256").update(unsigned).sign(sa.private_key, "base64url");
            const body = "grant_type=urn%3Aietf%3Aparams%3Aoauth%3Agrant-type%3Ajwt-bearer&assertion=" + unsigned + "." + sig;
            const req = https.request("https://oauth2.googleapis.com/token", {
              method: "POST",
              headers: { "Content-Type": "application/x-www-form-urlencoded", "Content-Length": Buffer.byteLength(body) }
            }, (res) => {
              let d = ""; res.on("data", c => d += c);
              res.on("end", () => {
                const j = JSON.parse(d);
                if (!j.access_token) { console.error("OAuth error:", d); process.exit(1); }
                process.stdout.write(j.access_token);
              });
            });
            req.write(body); req.end();
          ')
          export GCP_ACCESS_TOKEN="$GCP_TOKEN"
          python3 - << 'EOF'
          import json, os, urllib.request, sys

          tok = os.environ['GCP_ACCESS_TOKEN'].strip()
          hdrs = {'Authorization': f'Bearer {tok}', 'Content-Type': 'application/json'}
          proj = 'maas-takip-sync'
          rules_src = open('firestore.rules', encoding='utf-8').read()

          # 1. Compiler syntax & semantics check via :test
          test_body = json.dumps({
              'source': {'files': [{'name': 'firestore.rules', 'content': rules_src}]},
              'testSuite': {'testCases': []}
          }).encode()
          req_t = urllib.request.Request(f'https://firebaserules.googleapis.com/v1/projects/{proj}:test', data=test_body, headers=hdrs, method='POST')
          t_res = json.loads(urllib.request.urlopen(req_t).read().decode())
          issues = [i for i in t_res.get('issues', []) if i.get('severity') == 'ERROR']
          if issues:
              print('[FAIL] Firestore rules compilation errors:', issues, file=sys.stderr)
              sys.exit(1)
          print('[OK] firestore.rules compiled cleanly (0 errors)')

          # 2. Compare with currently active live ruleset so we only create a new release when rules changed
          req_rel = urllib.request.Request(f'https://firebaserules.googleapis.com/v1/projects/{proj}/releases/cloud.firestore', headers=hdrs)
          cur_rel = json.loads(urllib.request.urlopen(req_rel).read().decode())
          cur_rs_name = cur_rel['rulesetName']
          req_cur_rs = urllib.request.Request(f'https://firebaserules.googleapis.com/v1/{cur_rs_name}', headers=hdrs)
          cur_rs = json.loads(urllib.request.urlopen(req_cur_rs).read().decode())
          cur_content = (cur_rs.get('source', {}).get('files', [{}])[0].get('content') or '')

          if cur_content.strip() == rules_src.strip():
              print(f'[OK] Live Firebase ruleset ({cur_rs_name}) already matches firestore.rules')
          else:
              create_body = json.dumps({'source': {'files': [{'name': 'firestore.rules', 'content': rules_src}]}}).encode()
              req_c = urllib.request.Request(f'https://firebaserules.googleapis.com/v1/projects/{proj}/rulesets', data=create_body, headers=hdrs, method='POST')
              new_rs = json.loads(urllib.request.urlopen(req_c).read().decode())
              new_rs_name = new_rs['name']
              patch_body = json.dumps({'release': {'name': f'projects/{proj}/releases/cloud.firestore', 'rulesetName': new_rs_name}}).encode()
              req_p = urllib.request.Request(f'https://firebaserules.googleapis.com/v1/projects/{proj}/releases/cloud.firestore', data=patch_body, headers=hdrs, method='PATCH')
              urllib.request.urlopen(req_p).read()
              print(f'[OK] Published new Firebase Firestore ruleset to maas-takip-sync: {new_rs_name}')
          EOF

      - name: Post-Deploy Live Smoke Test (verify live version.json == expected)
        run: |
          EXPECTED=$(python3 -c "import json; print(json.load(open('version.json'))['v'])")
          echo "Expected live version: $EXPECTED"
          for i in 1 2 3 4 5; do
            sleep 5
            LIVE=$(curl -fsSL "https://shiftpay-app.pages.dev/version.json?t=$(date +%s)" | python3 -c "import sys,json; print(json.load(sys.stdin).get('v',''))" || true)
            echo "Attempt $i -> Live: $LIVE"
            if [ "$LIVE" = "$EXPECTED" ]; then
              echo "[OK] Post-Deploy Live Smoke Test PASSED ($LIVE)"
              exit 0
            fi
          done
          echo "[WARN] CDN cache may still be propagating; version.json did not reflect $EXPECTED within 25s"
          exit 0
